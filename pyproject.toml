[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scx-format"
version = "0.1.0a0"
description = "Text and Matrix Market interchange for single-cell data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24", "pandas>=2", "scipy>=1.10"]

[project.optional-dependencies]
anndata = ["anndata>=0.10"]
test = ["pytest>=7", "anndata>=0.10"]

[project.scripts]
scx = "scx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
