name: tests
on: [push, pull_request]
jobs:
  standalone:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Deliberately install only the analysis environment, never SCX.
      - run: pip install -r compatibility/anndata-0.13.4.txt
      - run: python scripts/build_standalone.py --check
      - run: python scripts/stage_standalone_release.py .compat-results/standalone-release
      - run: python scripts/check_standalone.py --script .compat-results/standalone-release/scx.py --require-uninstalled --output .compat-results/standalone-python
      - if: runner.os == 'Linux'
        name: Use Ubuntu HTTPS archive
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: adapters/seurat
      - name: Remove any cached SCX package; forbid package loads and subprocesses
        run: |
          Rscript -e 'for (lib in .libPaths()) if (file.exists(file.path(lib,"scxSeurat","DESCRIPTION"))) remove.packages("scxSeurat",lib=lib)'
          SCX_REQUIRE_UNINSTALLED=1 SCX_SCRIPT=.compat-results/standalone-release/scx.R Rscript scripts/check_standalone.R .compat-results/standalone-r .compat-results/standalone-python
      - run: python scripts/check_standalone_bridge.py .compat-results/standalone-r .compat-results/standalone-release/scx.py
      - run: python scripts/stage_standalone_release.py .compat-results/standalone-release --verify
      - name: Smoke-test the reproducible TSV measurement and source comparator
        run: |
          pip install -r benchmarks/requirements.txt
          python examples/tsv-pbmc3k/benchmark.py smoke --output .compat-results/tsv-benchmark
          python examples/tsv-pbmc3k/compare_optimization.py .compat-results/tsv-benchmark/run/report.json .compat-results/tsv-benchmark/run/report.json .compat-results/tsv-benchmark/run/self-comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.os }}
          path: |
            .compat-results/standalone-release/*
            .compat-results/standalone-python/report.json
            .compat-results/standalone-r/report.json
            .compat-results/standalone-r/bridge-report.json
            .compat-results/tsv-benchmark/run/report.json
            .compat-results/tsv-benchmark/run/summary.md
            .compat-results/tsv-benchmark/run/self-comparison.json
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            anndata: '0.11.4'
            requirements: compatibility/anndata-0.11.4.txt
          - python: '3.12'
            anndata: '0.12.3'
            requirements: compatibility/anndata-0.12.3.txt
          - python: '3.12'
            anndata: '0.13.4'
            requirements: compatibility/anndata-0.13.4.txt
          - python: '3.10'
            anndata: '0.11.4-scipy1.11'
            requirements: compatibility/scipy-1.11.4.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]' -r ${{ matrix.requirements }}
      - run: pytest -q --junitxml=.compat-results/python.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.python }}-anndata-${{ matrix.anndata }}
          path: .compat-results/python.xml
  seurat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        anndata: ['0.11.4', '0.12.3', '0.13.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]' -r compatibility/anndata-${{ matrix.anndata }}.txt
      # The Azure HTTP mirror intermittently stalls during setup-r's apt installs.
      - name: Use the Ubuntu HTTPS archive for R system dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: adapters/seurat
          extra-packages: any::testthat
      - run: R CMD INSTALL adapters/seurat
      - run: Rscript adapters/seurat/scripts/run-tests.R
      - run: Rscript adapters/seurat/scripts/compat-fixtures.R .r-tests/fixtures
      - run: python scripts/check_compatibility.py --fixtures .r-tests/fixtures --output .compat-results/bridge
      - run: python scripts/check_r_validation.py --output .compat-results/native-validation
      - name: Build and install release packages; run the external-user quickstart
        if: matrix.anndata == '0.13.4'
        run: |
          python -m pip install build
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          R CMD build adapters/seurat
          R CMD INSTALL scxSeurat_0.1.6.tar.gz
          mv scxSeurat_0.1.6.tar.gz dist/
          python examples/quickstart/verify.py --output .compat-results/release-smoke
      - uses: actions/upload-artifact@v4
        if: matrix.anndata == '0.13.4'
        with:
          name: release-packages-and-smoke
          path: |
            dist/*
            .compat-results/release-smoke/report.json
            .compat-results/release-smoke/R-versions.json
      - if: matrix.anndata == '0.13.4'
        run: |
          pip install -r benchmarks/requirements.txt
          python benchmarks/scale.py r-run --cells 100 --genes 50 --per-cell 5 --inputs benchmarks/work/r-inputs --output benchmarks/work/r-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seurat-anndata-${{ matrix.anndata }}
          path: |
            .compat-results/bridge/report.json
            .compat-results/native-validation/report.json
            .compat-results/native-validation/R-results.json
  r-only:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        name: Use Ubuntu HTTPS archive
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: adapters/seurat
          extra-packages: any::testthat
      - if: runner.os != 'Windows'
        run: R CMD INSTALL adapters/seurat
      - if: runner.os == 'Windows'
        run: R CMD INSTALL --build adapters/seurat
      - run: Rscript adapters/seurat/scripts/run-tests.R
      - run: Rscript adapters/seurat/scripts/test-installer.R
      - name: Hide Python and forbid subprocess calls during installed-package round trip
        run: Rscript adapters/seurat/scripts/r-only.R .r-tests/r-only
      - uses: actions/upload-artifact@v4
        with:
          name: r-only-${{ matrix.os }}
          path: |
            .r-tests/r-only/report.json
            scxSeurat_*.zip
  r-distribution:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: adapters/seurat
      - run: Rscript scripts/build_r_assets.R dist/r-assets
      - uses: actions/upload-artifact@v4
        with:
          name: r-distribution-${{ matrix.os }}
          path: dist/r-assets/
  windows-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]' -r compatibility/anndata-0.13.4.txt
      - run: pytest -q --junitxml=.compat-results/windows.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-safety
          path: .compat-results/windows.xml
  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]' -r compatibility/anndata-0.13.4.txt -r benchmarks/requirements.txt
      - run: python benchmarks/scale.py run --cells 20 100 --genes 50 --per-cell 5 --repeats 1 --output benchmarks/work/smoke
      - run: python benchmarks/check.py --output benchmarks/work/smoke
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: |
            benchmarks/work/smoke/report.json
            benchmarks/work/smoke/verification.json
