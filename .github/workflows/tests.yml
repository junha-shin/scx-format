name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: pytest -q
  seurat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: adapters/seurat
          extra-packages: any::testthat
      - run: Rscript adapters/seurat/scripts/run-tests.R
      - run: Rscript adapters/seurat/scripts/bridge.R .r-tests/bridge
      - run: python adapters/seurat/scripts/check_bridge.py .r-tests/bridge
      - run: Rscript examples/seurat/check_reverse.R .r-tests/bridge "$(which python)"
